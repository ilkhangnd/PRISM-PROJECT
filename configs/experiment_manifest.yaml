task:
  name: top5_multiclass_vulnerability_classification
  labels:
    - reentrancy
    - integer_overflow
    - access_control
    - unchecked_return
    - front_running
  minimum_nodes: 3
  feature_version: V2
  in_channels: 32
  edge_dim: 4
  graph_representation: homogeneous_merged
  edge_types: [sequential, branch, loop_back, data_dep]
  edge_encoding: one_hot_edge_attr

model:
  architecture: GNNMHAv2
  hidden_channels: 256
  num_heads: 8
  num_layers: 4
  jk_mode: cat
  dropout: 0.15
  drop_edge: 0.1

training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: focal
  focal_gamma: 2.0
  label_smoothing: 0.05
  batch_size: 64
  max_epochs: 35
  early_stopping_patience: 15
  epochs_trained: 35
  scheduler: OneCycleLR
  scheduler_pct_start: 0.1
  scheduler_anneal_strategy: cos
  split_seed: 42
  split: {train: 0.70, validation: 0.15, test: 0.15}

reported_metrics:
  test_accuracy: 0.7409
  test_macro_f1: 0.7577
  test_weighted_f1: 0.7589
